# Kasa Defteri CK — telefondan yükleme için sarmalayıcı.
# Depoda yalnızca bu dosya ve proje.zip bulunur. Zip bulutta açılır.
# 1) ios-deneme   : Apple hesabı gerektirmez, imzasız simülatör derlemesi (kontrol amaçlı).
# 2) ios-testflight: İMZALI derleme alır ve TestFlight'a yükler. Gerekenler:
#    - Codemagic > Integrations > App Store Connect'te "Ahmet Rauf Apple" adıyla API anahtarı (kurulu)
#    - (sonra) APP_STORE_APP_ID: App Store Connect > Uygulama > Uygulama Bilgileri > Apple Kimliği (sayı)
workflows:
  ios-deneme:
    name: iOS deneme derlemesi (imzasiz)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Proje zip dosyasini ac
        script: |
          unzip -q proje.zip
          ls kasa-defteri-mobil
      - name: Bagimliliklari kur
        script: |
          cd kasa-defteri-mobil
          npm install
      - name: Web paketini derle
        script: |
          cd kasa-defteri-mobil
          npm run build
      - name: iOS projesini olustur
        script: |
          cd kasa-defteri-mobil
          # Ilk 'cap add' pod install adiminda en dusuk iOS surumu yuzunden uyari verebilir; asagida duzeltilip tekrar esitleniyor.
          npx cap add ios || echo "cap add uyari verdi, devam ediliyor"
          test -d ios/App || { echo "ios/App olusmadi"; exit 1; }
          sed -i '' "s/^platform :ios, .*/platform :ios, '16.4'/" ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.4;/g" ios/App/App.xcodeproj/project.pbxproj
          bash scripts/ios-hazirla.sh
          echo '--- Podfile ---'; cat ios/App/Podfile
          npx cap sync ios
      - name: Simulator icin derle (imzasiz)
        script: |
          set -o pipefail
          cd kasa-defteri-mobil/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$CM_BUILD_DIR/xcodebuild.log"
    artifacts:
      - xcodebuild.log

  ios-testflight:
    name: iOS TestFlight (imzali)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Ahmet Rauf Apple"
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hudhudapps.kasadefteri
      vars:
        APP_STORE_APP_ID: "0"   # Apple Kimligi (sayi) gelince buraya yazilir; build numarasini her seferinde artirmak icin gerekir
    scripts:
      - name: Proje zip dosyasini ac
        script: |
          unzip -q proje.zip
          ls kasa-defteri-mobil
      - name: Bagimliliklari kur
        script: |
          cd kasa-defteri-mobil
          npm install
      - name: Web paketini derle
        script: |
          cd kasa-defteri-mobil
          npm run build
      - name: iOS projesini olustur ve magaza ayarlarini uygula
        script: |
          cd kasa-defteri-mobil
          npx cap add ios || echo "cap add uyari verdi, devam ediliyor"
          test -d ios/App || { echo "ios/App olusmadi"; exit 1; }
          sed -i '' "s/^platform :ios, .*/platform :ios, '16.4'/" ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.4;/g" ios/App/App.xcodeproj/project.pbxproj
          bash scripts/ios-hazirla.sh
          npx cap sync ios
      - name: Imza ayarlarini Xcode projesine uygula
        script: |
          cd kasa-defteri-mobil/ios/App
          xcode-project use-profiles
      - name: Build numarasini artir
        script: |
          cd kasa-defteri-mobil/ios/App
          SON=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          case "$SON" in ''|*[!0-9]*) SON=0;; esac
          YENI=$((SON + 1))
          echo "Build numarasi: $YENI"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $YENI;/g" App.xcodeproj/project.pbxproj
      - name: IPA olustur (App Store icin)
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/kasa-defteri-mobil/ios/App/App.xcworkspace" \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - cahit_kucuk@hotmail.com.tr
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: false
